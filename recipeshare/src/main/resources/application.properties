spring.application.name=recipeshare
server.port=8081

# H2 + JPA
# Use a file-based H2 DB and enable AUTO_SERVER so the console can connect reliably
spring.datasource.url=jdbc:h2:file:./data/recipeshare;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=1234
# JPA / Hibernate settings
## H2 dialect is auto-detected, so this line is optional
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console and allow web access from other hosts if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# LOGGING CONFIGURATION
# Set root logger to INFO and above
logging.level.root=INFO
# Set web layer (your package) to DEBUG for detailed request traces
logging.level.com.mcon152.recipeshare.web=DEBUG
# Keep Spring web internals at INFO (not flooding console)
logging.level.org.springframework.web=INFO

# Console pattern with timestamp, thread, level, logger, and message
# %highlight() = colors log level (ERROR=red, WARN=yellow, INFO=blue, DEBUG=green)
# %magenta() = colors message in pink/magenta
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %highlight(%-5level) %logger{36} - %magenta(%msg)%n

# Base log file - logs go here
logging.file.name=logs/recipeshare.log

# Rolling policy - when to rotate (compress) old logs
# file-name-pattern: archived logs get date and index (e.g., recipeshare-2025-11-20.1.log.gz)
logging.logback.rollingpolicy.file-name-pattern=logs/recipeshare-%d{yyyy-MM-dd}.%i.log.gz

# Rotate when file reaches 10
logging.logback.rollingpolicy.max-file-size=10MB

# Keep rotated logs for 7 days
logging.logback.rollingpolicy.max-history=7

# Limit total archived logs to 1GB of disk space
logging.logback.rollingpolicy.total-size-cap=1GB

# Clean old logs on startup
logging.logback.rollingpolicy.clean-history-on-start=true